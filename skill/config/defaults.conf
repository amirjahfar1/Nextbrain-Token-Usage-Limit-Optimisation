# key=value, comma lists. Override per project in .agents/token-optimisation.conf
# guard_mode: off | log (record only) | deny (block big reads without a range)
guard_mode=log
max_read_bytes=60000
never=**/pnpm-lock.yaml,**/package-lock.json,**/yarn.lock,**/dist/**,**/*.min.js
ranged=
# size limits: lines / bytes
max_md_lines=100
max_md_bytes=6144
max_code_lines=150
max_code_bytes=8192
max_data_lines=120
max_entry_lines=40
# session review: calibrate first, then flag above this percentile of own history
min_sessions_for_thresholds=10
cost_percentile=75
# model roles (owner-configurable, availability must be confirmed in the client)
# planner = strongest model: used ONLY when the owner names it for that task (rules/models.md L6), never auto-picked
role_planner=Fable
# deep = hard work that is not a named planner request (design, security, migrations): Opus-class, normal effort
role_deep=Opus
role_executor=Sonnet
role_economy=Haiku
models_checked=2026-11-21
# set enforce_size=0 in a project conf to make size checks advisory
enforce_size=1
